name: Deploy to evgeny.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab/package-lock.json

      # the game is the 3D version in lab/; the React version in src/ is no longer deployed
      - name: Install dependencies
        run: npm ci
        working-directory: lab

      - name: Build
        run: npm run build
        working-directory: lab

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: evgenyio/evgenyio.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: site

      # dist includes sw.js, which retires the old game's service worker for returning players
      - name: Deploy to /games/water-sort/
        run: |
          mkdir -p site/games/water-sort
          rm -rf site/games/water-sort/*
          cp -r lab/dist/* site/games/water-sort/

      # the lab's earlier address keeps working
      - name: Deploy to /games/water-sort-lab/
        run: |
          mkdir -p site/games/water-sort-lab
          rm -rf site/games/water-sort-lab/*
          cp -r lab/dist/* site/games/water-sort-lab/

      - name: Commit and push
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/water-sort games/water-sort-lab
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy water-sort game"
            git push
          fi
